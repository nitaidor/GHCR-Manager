name: Build & Release All Platforms (v* Tags & Manual Run)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional tag to create/update a GitHub Release when run manually (e.g. v1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            cmd: npm run dist:win
          - platform: Linux
            os: ubuntu-latest
            cmd: npm run dist:linux
          - platform: macOS
            os: macos-latest
            cmd: npm run dist:mac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Build Desktop Installer (${{ matrix.platform }})
        run: ${{ matrix.cmd }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            dist-exe/*.exe
            dist-exe/*.AppImage
            dist-exe/*.deb
            dist-exe/*.dmg
            dist-exe/*.zip
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Generate & Sync Capacitor Android project
        run: |
          npm install @capacitor/android@^7.0.0 --no-save
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ghcr-manager-android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ghcr-manager-android.apk

  ios:
    name: iOS Build (Unsigned Bundle)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies & build web bundle
        run: |
          npm install
          npm run build

      - name: Generate & Sync Capacitor iOS project
        run: |
          npm install @capacitor/ios@^7.0.0 --no-save
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Package iOS Xcode Project & Web Bundle
        run: |
          zip -r ghcr-manager-ios-project.zip ios
        if: always()

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundle
          path: ghcr-manager-ios-project.zip

  release:
    name: Publish GitHub Release
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.apk
